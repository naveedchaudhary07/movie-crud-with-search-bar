        <div class="backdrop" id="backdrop"></div>
        <div class="container">
          <div class="moviemodel" id="moviemodel">
            <form id="formSub">
              <div class="card bg-dark text-white">
                <div class="card-header d-flex justify-content-between">
                  <h4 class="form-heading">Add Movie</h4>
                  <i
                    role="button"
                    class="fa-solid fa-x fa-2x"
                    id="closeModel"
                  ></i>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label for="moviename">Movie Name</label>
                    <input
                      type="text" required autocomplete="off"
                      class="form-control bg-secondary text-white"
                      id="moviename"
                    />
                  </div>
                  <div class="form-group">
                    <label for="movieimage">Movie Image</label>
                    <input
                      type="text" required autocomplete="off"
                      class="form-control bg-secondary text-white"
                      id="movieimage"
                    />
                  </div>
                  <div class="form-group">
                    <label for="movieDesc">Movie Description</label>
                    <input
                      type="text" required autocomplete="off"
                      class="form-control bg-secondary text-white"
                      id="movieDesc"
                    />
                  </div>
                  <div class="form-group">
                    <label for="movieRat">Movie Rating</label>
                    <select name="" id="movieRat" class="form-control bg-secondary text-white ">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="5">5</option>
                    </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                  <button type="submit" class="btn btn-sm add-btn" id="addmovie"> Add Movie</button>
                  <button type="button" class="btn btn-sm update-btn d-none" id="updatebtn">Update Movie</button>
                  <button type="button" class="btn btn-sm close-btn" id="closebtn">Close</button>
                </div>
              </div>
            </form>
          </div>
        </div>
